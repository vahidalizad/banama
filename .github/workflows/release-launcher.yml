name: Release BananaLauncher

on:
  push:
    branches: [main]
    paths:
      - 'Launcher/**'
      - '*'
      - '.github/workflows/release-launcher.yml'
      - '.github/release-notes.sh'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Android toolchain
        run: docker buildx build --platform linux/amd64 --load -t tv-android-dev .
      - name: Restore distribution signing files
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          docker run --rm --mount type=volume,source=tv-android-home,target=/home/android \
            --env RELEASE_KEYSTORE --env RELEASE_PASSWORD tv-android-dev sh -eu -c '
              umask 077
              dir="$HOME/.android/bananalauncher"
              mkdir -p "$dir"
              printf %s "${RELEASE_KEYSTORE:?Set ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 -d > "$dir/release.p12"
              printf %s "${RELEASE_PASSWORD:?Set ANDROID_RELEASE_KEYSTORE_PASSWORD}" > "$dir/password"
            '
      - name: Build signed BananaLauncher APK
        run: |
          # The Android toolchain runs as UID 1000.
          sudo chown -R 1000 Launcher
          ./dev Launcher ./release-apk
      - name: Publish BananaLauncher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="launcher-$GITHUB_SHA"
          apk=Launcher/artifacts/BananaLauncher.apk
          notes=$(bash .github/release-notes.sh launcher "$GITHUB_SHA")
          if release=$(gh release view "$tag" --json isDraft,body 2>/dev/null); then
            if [[ $(jq -r .isDraft <<< "$release") == true ]]; then
              body=$(jq -r '.body // empty' <<< "$release")
              if [[ -n "$body" && "$body" != "$notes" && "$body" != "Built from $GITHUB_SHA." ]]; then
                notes="$body"$'\n\n'"$notes"
              fi
              gh release upload "$tag" "$apk" --clobber
              gh release edit "$tag" --draft=false --notes "$notes"
            fi
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "BananaLauncher (${GITHUB_SHA::7})" --notes "$notes"
          fi
